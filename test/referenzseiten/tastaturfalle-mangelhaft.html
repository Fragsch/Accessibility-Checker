<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter der Musterakademie abonnieren</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
    :focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
    a { color: #0b4da2; }
    main { padding: 0 1rem 2rem; }
    h1 { line-height: 1.3; }
    label { display: block; margin-top: 1rem; }
    input { border: 1px solid #767676; padding: .4rem; min-height: 24px; }
    button { min-width: 24px; min-height: 24px; padding: .5rem 1rem; }
  </style>
</head>
<body>

<!--
  Diese Seite steht fuer sich, weil sie den Tastatur-Durchlauf abbricht: Was
  hinter der Falle liegt, wird von keiner Pruefung mehr erreicht. Eine Falle in
  einer Seite mit vielen weiteren Verstoessen wuerde die Messung verfaelschen.
-->

<header>
  <nav aria-label="Hauptnavigation">
    <a href="/">Start</a>
  </nav>
</header>

<main>

  <h1>Newsletter abonnieren</h1>

  <p>Tragen Sie Ihre Anschrift ein, um den Newsletter zu erhalten.</p>

  <form action="/newsletter" method="post" novalidate>
    <label for="newsletter-mail">E-Mail-Adresse</label>
    <!-- 2.1.2 VERSTOSS: Tastaturfalle. Das Feld faengt die Tabulatortaste ab
         und holt den Fokus zurueck. Wer nur die Tastatur benutzt, kommt hier
         nicht mehr weg und muss die Seite verlassen. -->
    <input type="email" id="newsletter-mail" name="mail" autocomplete="email" onkeydown="halten(event)">

    <button type="submit">Abonnieren</button>
  </form>

  <p><a href="/datenschutz">Hinweise zum Datenschutz beim Newsletter</a></p>

</main>

<script>
  function halten(e) {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    e.target.focus();
  }
</script>

</body>
</html>
