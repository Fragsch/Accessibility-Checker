<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite ohne Medien und ohne Formular</title>
  </head>
  <body>
    <!--
      Beispielseite fuer die Anwendbarkeitserkennung (ARCHITEKTUR 5.5).
      Bewusst ohne Video, Audio, Formular und Tabelle: die darauf bezogenen
      Kriterien muessen "nicht anwendbar" ergeben, nicht "erfuellt".
    -->
    <header>
      <a href="#inhalt">Zum Inhalt springen</a>
    </header>
    <main id="inhalt">
      <h1>Eine Seite aus reinem Text</h1>
      <p>
        Diese Seite enthaelt nur Fliesstext. Sie dient dazu, die Erkennung
        gegenstandsloser Erfolgskriterien zu pruefen.
      </p>
    </main>
    <footer>
      <p>Beispielseite des Pruefwerkzeugs.</p>
    </footer>
  </body>
</html>
